name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Scans the commits of this push / pull request, not the whole history.
      # Existing history already contains committed credentials: see
      # docs/security/SECURITY_CHECKLIST.md (SEC-001).
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  engine-api:
    name: Engine API (build + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GVRP_Engine_API
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: GVRP_Engine_API/pom.xml
      # Excluded tests need infrastructure that CI does not have:
      # @SpringBootTest classes load GraphHopper from ./.data/*.osm.pbf
      # (gitignored, several hundred MB). They are NOT disabled; they still run
      # locally with `mvnw.cmd test`. Changing this list requires user approval
      # (AGENTS.md section 14).
      - name: Build and test
        run: >
          bash ./mvnw -B -ntp verify
          -Dsurefire.failIfNoSpecifiedTests=false
          "-Dtest=!GvrpEngineApiApplicationTests,!KMeansClustererTest,!VehicleClusterAssignerTest,!BridgeCrossingWorstCaseTest,!CircuityFactorMeasurementTest,!GeoUtilsTest,!JspritConvergenceBenchmarkTest,!JspritPerformanceBenchmarkTest"

  entry-api:
    name: Entry API (build + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GVRP_Entry_API
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: GVRP_Entry_API/pom.xml
      # Excluded tests are @SpringBootTest classes that need the MySQL
      # database. They still run locally. Changing this list requires user
      # approval (AGENTS.md section 14).
      - name: Build and test
        run: >
          bash ./mvnw -B -ntp verify
          -Dsurefire.failIfNoSpecifiedTests=false
          "-Dtest=!GvrpEntryApiApplicationTests,!DepotMapperTest"

  client-build:
    name: Client v2 (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GVRP_Entry_client_v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: GVRP_Entry_client_v2/package-lock.json
      - run: npm ci
      - run: npm run build

  client-test:
    name: Client v2 (unit tests)
    runs-on: ubuntu-latest
    # Blocking since 2026-10-23: the 5 former pre-existing failures are fixed
    # (TEST-CLIENT-001; full suite 245/245, see
    # work-items/DRIVER-MAP-004/verification-rereview.md).
    defaults:
      run:
        working-directory: GVRP_Entry_client_v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: GVRP_Entry_client_v2/package-lock.json
      - run: npm ci
      # Ubuntu 24.04 runners restrict unprivileged user namespaces, which
      # breaks the Chrome sandbox used by Karma.
      - name: Allow Chrome sandbox
        working-directory: .
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npx ng test --watch=false --browsers=ChromeHeadless

  tools:
    name: Workflow tool tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test tools/feature-workflow/workflow.test.mjs tools/session-brief.test.mjs
