<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1314px;height:629px;background:#FFFFFF;" width="1314px" height="629px" viewBox="0 0 1314 629" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="311.821" y="37.118" fill="#000" font-size="22" textLength="688.843" font-weight="700" font-family="Verdana">D03 order status — transitions enforced by OrderStatus</text></g><g class="start_entity" data-qualified-name=".start." id="ent0001" data-source-line="4"><ellipse cx="581.5" cy="293.237" rx="10" ry="10" fill="#FFF" style="stroke:#000;stroke-width:1;"/></g><g class="entity" data-qualified-name="SCHEDULED" id="ent0002" data-source-line="4"><rect x="367" y="422.737" width="107.186" height="50" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="12.5" ry="12.5"/><line x1="367" y1="449.752" x2="474.186" y2="449.752" style="stroke:#000;stroke-width:1;"/><text x="377" y="441.813" fill="#000" font-size="14" textLength="87.186" font-family="Verdana">SCHEDULED</text></g><g class="entity" data-qualified-name="ON_ROUTE" id="ent0004" data-source-line="6"><rect x="12" y="565.737" width="98.873" height="50" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="12.5" ry="12.5"/><line x1="12" y1="592.752" x2="110.873" y2="592.752" style="stroke:#000;stroke-width:1;"/><text x="22" y="584.813" fill="#000" font-size="14" textLength="78.873" font-family="Verdana">ON_ROUTE</text></g><g class="entity" data-qualified-name="UNASSIGNED" id="ent0006" data-source-line="7"><rect x="385.5" y="565.737" width="116.291" height="50" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="12.5" ry="12.5"/><line x1="385.5" y1="592.752" x2="501.791" y2="592.752" style="stroke:#000;stroke-width:1;"/><text x="395.5" y="584.813" fill="#000" font-size="14" textLength="96.291" font-family="Verdana">UNASSIGNED</text></g><g class="entity" data-qualified-name="REJECTED" id="ent0008" data-source-line="8"><rect x="352.5" y="268.237" width="91.846" height="50" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="12.5" ry="12.5"/><line x1="352.5" y1="295.252" x2="444.346" y2="295.252" style="stroke:#000;stroke-width:1;"/><text x="362.5" y="287.313" fill="#000" font-size="14" textLength="71.846" font-family="Verdana">REJECTED</text></g><g class="entity" data-qualified-name="SERVICING" id="ent0011" data-source-line="11"><rect x="512" y="94.237" width="100.616" height="50" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="12.5" ry="12.5"/><line x1="512" y1="121.252" x2="612.616" y2="121.252" style="stroke:#000;stroke-width:1;"/><text x="522" y="113.313" fill="#000" font-size="14" textLength="80.616" font-family="Verdana">SERVICING</text></g><g class="entity" data-qualified-name="COMPLETED" id="ent0013" data-source-line="12"><rect x="626.5" y="268.237" width="105.948" height="50" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="12.5" ry="12.5"/><line x1="626.5" y1="295.252" x2="732.448" y2="295.252" style="stroke:#000;stroke-width:1;"/><text x="636.5" y="287.313" fill="#000" font-size="14" textLength="85.948" font-family="Verdana">COMPLETED</text></g><g class="entity" data-qualified-name="GMN19" id="ent0020" data-source-line="20"><path d="M744,58.737 L744,179.333 L1178.575,179.333 L1178.575,68.737 L1168.575,58.737 L744,58.737" style="stroke:#000;stroke-width:1;" fill="#FFF"/><path d="M1168.575,58.737 L1168.575,68.737 L1178.575,68.737 L1168.575,58.737" style="stroke:#000;stroke-width:1;" fill="#FFF"/><text x="750" y="76.807" fill="#000" font-size="13" textLength="413.575" font-family="Verdana">Allowed transitions come from OrderStatus.allowedTransitions:</text><text x="750" y="92.606" fill="#000" font-size="13" textLength="363.746" font-family="Verdana">SCHEDULED   -> ON_ROUTE, UNASSIGNED, REJECTED</text><text x="750" y="108.406" fill="#000" font-size="13" textLength="187.491" font-family="Verdana">ON_ROUTE    -> SERVICING</text><text x="750" y="124.205" fill="#000" font-size="13" textLength="265.503" font-family="Verdana">SERVICING   -> COMPLETED, REJECTED</text><text x="750" y="140.004" fill="#000" font-size="13" textLength="195.59" font-family="Verdana">COMPLETED   -> SCHEDULED</text><text x="750" y="155.804" fill="#000" font-size="13" textLength="200.624" font-family="Verdana">UNASSIGNED  -> SCHEDULED</text><text x="750" y="171.603" fill="#000" font-size="13" textLength="187.065" font-family="Verdana">REJECTED    -> SCHEDULED</text></g><g class="entity" data-qualified-name="GMN22" id="ent0023" data-source-line="30"><path d="M768,256.737 L768,329.935 L1299.485,329.935 L1299.485,266.737 L1289.485,256.737 L768,256.737" style="stroke:#000;stroke-width:1;" fill="#FFF"/><path d="M1289.485,256.737 L1289.485,266.737 L1299.485,266.737 L1289.485,256.737" style="stroke:#000;stroke-width:1;" fill="#FFF"/><text x="774" y="274.807" fill="#000" font-size="13" textLength="510.485" font-family="Verdana">The callback path writes ON_ROUTE / UNASSIGNED directly on the entity and</text><text x="774" y="290.606" fill="#000" font-size="13" textLength="475.522" font-family="Verdana">therefore does not consult this table; only PATCH /orders/status and the</text><text x="774" y="306.406" fill="#000" font-size="13" textLength="269.515" font-family="Verdana">single-order transition service validate it.</text><text x="774" y="322.205" fill="#000" font-size="13" textLength="490.407" font-family="Verdana">There is no CANCELLED state: a cancelled job leaves its orders untouched.</text></g><!--link *start* to SCHEDULED--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk3" data-source-line="4" data-link-type="dependency"><path d="M580.24,303.357 C577.17,322.367 567.61,366.617 542.5,392.737 C524.12,411.857 502.493,423.007 478.983,431.337" style="stroke:#000;stroke-width:1;" fill="none" id="*start*-to-SCHEDULED"/><polygon points="474.27,433.007,484.089,433.772,478.983,431.337,481.417,426.231,474.27,433.007" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="600.018" y="373.807" fill="#000" font-size="13" textLength="152.261" font-family="Verdana">created (POST /orders)</text><text x="564.5" y="389.606" fill="#000" font-size="13" textLength="223.298" font-family="Verdana">status must be null in the payload</text></g><!--link SCHEDULED to ON_ROUTE--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk5" data-source-line="6" data-link-type="dependency"><path d="M366.93,448.467 C306.74,450.427 207.99,460.597 135.5,502.737 C109.61,517.787 91.23,541.145 78.28,561.225" style="stroke:#000;stroke-width:1;" fill="none" id="SCHEDULED-to-ON_ROUTE"/><polygon points="75.57,565.427,83.809,560.032,78.28,561.225,77.086,555.696,75.57,565.427" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="136.5" y="516.807" fill="#000" font-size="13" textLength="128.185" font-family="Verdana">completion callback</text><text x="149.103" y="532.606" fill="#000" font-size="13" textLength="102.978" font-family="Verdana">(planned order)</text></g><!--link SCHEDULED to UNASSIGNED--><g class="link" data-entity-1="ent0002" data-entity-2="ent0006" id="lnk7" data-source-line="7" data-link-type="dependency"><path d="M424.45,472.977 C428.67,498.797 434.496,534.522 438.716,560.412" style="stroke:#000;stroke-width:1;" fill="none" id="SCHEDULED-to-UNASSIGNED"/><polygon points="439.52,565.347,442.02,555.821,438.716,560.412,434.124,557.108,439.52,565.347" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="435.5" y="516.807" fill="#000" font-size="13" textLength="128.185" font-family="Verdana">completion callback</text><text x="439.877" y="532.606" fill="#000" font-size="13" textLength="119.431" font-family="Verdana">(unplanned order)</text></g><!--link SCHEDULED to 