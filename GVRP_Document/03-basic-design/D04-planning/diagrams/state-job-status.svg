<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1587px;height:726px;background:#FFFFFF;" width="1587px" height="726px" viewBox="0 0 1587 726" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="621.188" y="37.118" fill="#000" font-size="22" textLength="342.858" font-weight="700" font-family="Verdana">D04 optimisation job status</text></g><g class="start_entity" data-qualified-name=".start." id="ent0001" data-source-line="4"><ellipse cx="844.41" cy="68.737" rx="10" ry="10" fill="#FFF" style="stroke:#000;stroke-width:1;"/></g><g class="entity" data-qualified-name="PENDING" id="ent0002" data-source-line="4"><rect x="801.41" y="183.237" width="85.775" height="50" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="12.5" ry="12.5"/><line x1="801.41" y1="210.252" x2="887.185" y2="210.252" style="stroke:#000;stroke-width:1;"/><text x="811.41" y="202.313" fill="#000" font-size="14" textLength="65.775" font-family="Verdana">PENDING</text></g><g class="entity" data-qualified-name="PROCESSING" id="ent0004" data-source-line="6"><rect x="405.41" y="341.237" width="114.186" height="50" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="12.5" ry="12.5"/><line x1="405.41" y1="368.252" x2="519.596" y2="368.252" style="stroke:#000;stroke-width:1;"/><text x="415.41" y="360.313" fill="#000" font-size="14" textLength="94.186" font-family="Verdana">PROCESSING</text></g><g class="entity" data-qualified-name="FAILED" id="ent0006" data-source-line="7"><rect x="638.91" y="503.737" width="70.941" height="50" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="12.5" ry="12.5"/><line x1="638.91" y1="530.752" x2="709.851" y2="530.752" style="stroke:#000;stroke-width:1;"/><text x="648.91" y="522.813" fill="#000" font-size="14" textLength="50.941" font-family="Verdana">FAILED</text></g><g class="entity" data-qualified-name="COMPLETED" id="ent0008" data-source-line="9"><rect x="20.41" y="662.737" width="105.948" height="50" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="12.5" ry="12.5"/><line x1="20.41" y1="689.752" x2="126.358" y2="689.752" style="stroke:#000;stroke-width:1;"/><text x="30.41" y="681.813" fill="#000" font-size="14" textLength="85.948" font-family="Verdana">COMPLETED</text></g><g class="entity" data-qualified-name="CANCELLED" id="ent0011" data-source-line="11"><rect x="305.41" y="503.737" width="103.672" height="50" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="12.5" ry="12.5"/><line x1="305.41" y1="530.752" x2="409.082" y2="530.752" style="stroke:#000;stroke-width:1;"/><text x="315.41" y="522.813" fill="#000" font-size="14" textLength="83.672" font-family="Verdana">CANCELLED</text></g><g class="entity" data-qualified-name="GMN18" id="ent0019" data-source-line="21"><path d="M1055.41,171.737 L1055.41,244.935 L1415.73,244.935 L1415.73,181.737 L1405.73,171.737 L1055.41,171.737" style="stroke:#000;stroke-width:1;" fill="#FFF"/><path d="M1405.73,171.737 L1405.73,181.737 L1415.73,181.737 L1405.73,171.737" style="stroke:#000;stroke-width:1;" fill="#FFF"/><text x="1061.41" y="189.807" fill="#000" font-size="13" textLength="329.278" font-family="Verdana">A completion callback that arrives while the row is</text><text x="1061.41" y="205.606" fill="#000" font-size="13" textLength="339.32" font-family="Verdana">still PENDING is answered 503, not 200: the engine</text><text x="1061.41" y="221.406" fill="#000" font-size="13" textLength="329.189" font-family="Verdana">keeps the payload and retries after about 60 s, by</text><text x="1061.41" y="237.205" fill="#000" font-size="13" textLength="304.129" font-family="Verdana">which time the dispatch has set PROCESSING.</text></g><g class="entity" data-qualified-name="GMN21" id="ent0022" data-source-line="28"><path d="M1164.91,321.737 L1164.91,410.734 L1572.235,410.734 L1572.235,331.737 L1562.235,321.737 L1164.91,321.737" style="stroke:#000;stroke-width:1;" fill="#FFF"/><path d="M1562.235,321.737 L1562.235,331.737 L1572.235,331.737 L1562.235,321.737" style="stroke:#000;stroke-width:1;" fill="#FFF"/><text x="1170.91" y="339.807" fill="#000" font-size="13" textLength="319.439" font-family="Verdana">There is no transition out of FAILED other than a</text><text x="1170.91" y="355.606" fill="#000" font-size="13" textLength="305.094" font-family="Verdana">completion callback, and no automatic retry of</text><text x="1170.91" y="371.406" fill="#000" font-size="13" textLength="348.436" font-family="Verdana">dispatch. A cancelled job never returns to the queue.</text><text x="1170.91" y="387.205" fill="#000" font-size="13" textLength="386.325" font-family="Verdana">canBeCancelled() == (status == PROCESSING) is the only</text><text x="1170.91" y="403.004" fill="#000" font-size="13" textLength="209.27" font-family="Verdana">guard the cancel endpoint uses.</text></g><!--link *start* to PENDING--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk3" data-source-line="4" data-link-type="dependency"><path d="M844.41,78.757 C844.41,99.667 844.41,147.027 844.41,178.067" style="stroke:#000;stroke-width:1;" fill="none" id="*start*-to-PENDING"/><polygon points="844.41,183.067,848.41,174.067,844.41,178.067,840.41,174.067,844.41,183.067" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="914.384" y="122.807" fill="#000" font-size="13" textLength="106.285" font-family="Verdana">POST /jobs/plan</text><text x="845.41" y="138.606" fill="#000" font-size="13" textLength="244.232" font-family="Verdana">row committed, engine not yet called</text></g><!--link PENDING to PROCESSING--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk5" data-source-line="6" data-link-type="dependency"><path d="M801.31,224.217 C765.07,237.017 712.03,256.247 666.41,274.737 C614.16,295.917 559.955,320.163 518.965,338.963" style="stroke:#000;stroke-width:1;" fill="none" id="PENDING-to-PROCESSING"/><polygon points="514.42,341.047,524.268,340.931,518.965,338.963,520.933,333.659,514.42,341.047" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="667.41" y="288.807" fill="#000" font-size="13" textLength="150.985" font-family="Verdana">dispatch answered 202</text></g><!--link PENDING to FAILED--><g class="link" data-entity-1="ent0002" data-entity-2="ent0006" id="lnk7" data-source-line="7" data-link-type="dependency"><path d="M847.87,233.417 C853.7,283.877 859.83,401.647 803.41,473.737 C780.74,502.707 744.612,515.265 714.902,521.535" style="stroke:#000;stroke-width:1;" fill="none" id="PENDING-to-FAILED"/><polygon points="710.01,522.567,719.642,524.623,714.902,521.535,717.99,516.795,710.01,522.567" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="927.998" y="363.807" fill="#000" font-size="13" textLength="132.679" font-family="Verdana">engine unreachable,</text><text x="852.41" y="379.606" fill="#000" font-size="13" textLength="283.854" font-family="Verdana">non-202 answer, or any dispatch exception</text></g><!--link PROCESSING to COMPLETED--><g class="link" data-entity-1="ent0004" data-entity-2="ent0008" id="lnk9" data-source-line="9" data-link-type="dependency"><path d="M405.03,369.507 C306.23,374.707 110.36,391.157 66.41,440.737 C11,503.237 42.497,609.084 61.337,657.824" style="stroke:#000;stroke-width:1;" fill="none" id="PROCESSING-to-COMPLETED"/><polygon points="63.14,662.487,63.626,652.65,61.337,657.824,56.164,655.535,63.14,662.487" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="66.502" y="526.307" fill="#000" font-size="13" textLength="169.793" font-family="Verdana">POST /callbacks/complete</text><text x="39.41" y="542.106" fill="#000" font-size="13" textLength="223.977" font-family="Verdana">solution persisted, orders updated</text></g><!--link PROCESSING to FAILED--><g class="link" data-entity-1="ent0004" data-entity-2="ent0006" id="lnk10" data-source-line="10" data-link-type="dependency"><path d="M519.74,384.417 C552.3,396.307 592.25,414.727 621.41,440.737 C640.94,458.157 653.504,479.983 662.394,499.123" style="stroke:#000;stroke-width:1;" fill="none" id="PROCESSING-to-FAILED"/><polygon points="664.5,503.657,664.337,493.81,662.394,499.123,657.081,497.18,664.5,503.657" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="649.41" y="462.807" fill="#000" font-size="13" textLength="145.564" font-family="Verdana">POST /callbacks/failed</text></g><!--link PROCESSING to CANCELLED--><g class="link" data-entity-1="ent0004" data-entity-2="ent0011" id="lnk12" data-source-line="11" data-link-type="dependency"><path d="M405.07,370.287 C312.68,376.527 137.37,394.327 99.41,440.737 C12.05,547.567 51.33,450.987 277.41,503.737 C286.45,505.847 291.166,507.012 300.356,509.662" style="stroke:#000;stroke-width:1;" fill="none" id="PROCESSING-to-CANCELLED"/><polygon points="305.16,511.047,297.621,504.71,300.356,509.662,295.404,512.397,305.16,511.047" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="228.334" y="454.807" fill="#000" font-size="13" textLength="63.077" font-family="Verdana">PUT /jobs</text><text x="100.41" y="470.606" fill="#000" font-size="13" textLength="318.925" font-family="Verdana">(Entry writes CANCELLED, then asks the engine)</text></g><!--link PROCESSING to CANCELLED--><g class="link" data-entity-1="ent0004" data-entity-2="ent0011" id="lnk13" data-source-line="12" data-link-type="dependency"><path d="M457.46,391.397 C451.93,414.197 441.32,448.537 423.41,473.737 C415.43,484.957 408.459,492.052 397.819,500.482" style="stroke:#000;stroke-width:1;" fill="none" id="PROCESSING-to-CANCELLED-1"/><polygon points="393.9,503.587,403.438,501.133,397.819,500.482,398.47,494.863,393.9,503.587" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="442.41" y="462.807" fill="#000" font-size="13" textLength="170.511" font-family="Verdana">POST /callbacks/cancelled</text></g><!--link FAILED to COMPLETED--><g class="link" data-entity-1="ent0006" data-entity-2="ent0008" id="lnk14" data-source-line="14" data-link-type="dependency"><path d="M638.67,546.397 C632.32,549.037 625.73,551.607 619.41,553.737 C442.6,613.347 230.151,657.19 131.511,676.02" style="stroke:#000;stroke-width:1;" fill="none" id="FAILED-to-COMPLETED"/><polygon points="126.6,676.957,136.19,679.199,131.511,676.02,134.69,671.341,126.6,676.957" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="595.385" y="597.807" fill="#000" font-size="13" textLength="169.793" font-family="Verdana">POST /callbacks/complete</text><text x="518.41" y="613.606" fill="#000" font-size="13" textLength="323.743" font-family="Verdana">(accepted on purpose: a job marked FAILED by a</text><text x="533.114" y="629.406" fill="#000" font-size="13" textLength="294.334" font-family="Verdana">processing error must still accept the replay)</text></g><!--link COMPLETED to COMPLETED--><g class="link" data-entity-1="ent0008" data-entity-2="ent0008" id="lnk15" data-source-line="16" data-link-type="dependency"><path d="M126.68,673.127 C145.81,672.817 161.41,677.687 161.41,687.737 C161.41,697.787 150.809,702.738 131.679,702.428" style="stroke:#000;stroke-width:1;" fill="none" id="COMPLETED-to-COMPLETED"/><polygon points="126.68,702.347,135.614,706.493,131.679,702.428,135.744,698.494,126.68,702.347" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="167.41" y="685.307" fill="#000" font-size="13" textLength="135.104" font-family="Verdana">duplicate completion</text><text x="170.638" y="701.106" fill="#000" font-size="13" textLength="128.648" font-family="Verdana">(idempotent no-op)</text></g><!--link CANCELLED to CANCELLED--><g class="link" data-entity-1="ent0011" data-entity-2="ent0011" id="lnk16" data-source-line="17" data-link-type="dependency"><path d="M409.65,515.637 C428.76,515.277 444.41,519.647 444.41,528.737 C444.41,537.827 433.759,542.291 414.649,541.931" style="stroke:#000;stroke-width:1;" fill="none" id="CANCELLED-to-CANCELLED"/><polygon points="409.65,541.837,418.573,546.006,414.649,541.931,418.724,538.008,409.65,541.837" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="450.41" y="526.307" fill="#000" font-size="13" textLength="163.947" font-family="Verdana">late completion or failure</text><text x="501.893" y="542.106" fill="#000" font-size="13" textLength="60.982" font-family="Verdana">(ignored)</text></g><!--link FAILED to FAILED--><g class="link" data-entity-1="ent0006" data-entity-2="ent0006" id="lnk17" data-source-line="18" data-link-type="dependency"><path d="M709.96,516.077 C728.34,514.127 744.91,518.347 744.91,528.737 C744.91,539.127 733.312,543.875 714.932,541.925" style="stroke:#000;stroke-width:1;" fill="none" id="FAILED-to-FAILED"/><polygon points="709.96,541.397,718.488,546.324,714.932,541.925,719.332,538.369,709.96,541.397" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="750.91" y="526.307" fill="#000" font-size="13" textLength="104.609" font-family="Verdana">duplicate failure</text><text x="778.306" y="542.106" fill="#000" font-size="13" textLength="49.816" font-family="Verdana">(no-op)</text></g><!--link PENDING to GMN18--><g class="link" data-entity-1="ent0002" data-entity-2="ent0019" id="lnk20" data-source-line="21" data-link-type="association"><path d="M887.56,208.237 C943.49,208.237 999.43,208.237 1055.37,208.237" style="stroke:#000;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="PENDING-GMN18"/></g><!--link GMN18 to GMN21--><g class="link" data-entity-1="ent0019" data-entity-2="ent0022" id="lnk23"