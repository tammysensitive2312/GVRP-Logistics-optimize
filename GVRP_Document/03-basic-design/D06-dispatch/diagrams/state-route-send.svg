<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:604px;height:491px;background:#FFFFFF;" width="604px" height="491px" viewBox="0 0 604 491" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="78.437" y="37.118" fill="#000" font-size="22" textLength="445.5" font-weight="700" font-family="Verdana">D06 route send status (SendStatus)</text></g><g class="start_entity" data-qualified-name=".start." id="ent0001" data-source-line="4"><ellipse cx="74" cy="68.737" rx="10" ry="10" fill="#FFF" style="stroke:#000;stroke-width:1;"/></g><g class="entity" data-qualified-name="CURRENT" id="ent0002" data-source-line="4"><rect x="30.5" y="183.237" width="87.443" height="50" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="12.5" ry="12.5"/><line x1="30.5" y1="210.252" x2="117.943" y2="210.252" style="stroke:#000;stroke-width:1;"/><text x="40.5" y="202.313" fill="#000" font-size="14" textLength="67.443" font-family="Verdana">CURRENT</text></g><g class="entity" data-qualified-name="SUPERSEDED" id="ent0004" data-source-line="5"><rect x="12" y="341.237" width="115.696" height="50" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="12.5" ry="12.5"/><line x1="12" y1="368.252" x2="127.696" y2="368.252" style="stroke:#000;stroke-width:1;"/><text x="22" y="360.313" fill="#000" font-size="14" textLength="95.696" font-family="Verdana">SUPERSEDED</text></g><g class="end_entity" data-qualified-name=".end." id="ent0006" data-source-line="6"><ellipse cx="70" cy="466.737" rx="11" ry="11" fill="none" style="stroke:#000;stroke-width:1;"/><ellipse cx="70" cy="466.737" rx="6" ry="6" fill="#FFF" style="stroke:#000;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN8" id="ent0009" data-source-line="9"><path d="M156.5,171.737 L156.5,244.935 L589.374,244.935 L589.374,181.737 L579.374,171.737 L156.5,171.737" style="stroke:#000;stroke-width:1;" fill="#FFF"/><path d="M579.374,171.737 L579.374,181.737 L589.374,181.737 L579.374,171.737" style="stroke:#000;stroke-width:1;" fill="#FFF"/><text x="162.5" y="189.807" fill="#000" font-size="13" textLength="395.992" font-family="Verdana">At most one CURRENT send per route: the insert runs under</text><text x="162.5" y="205.606" fill="#000" font-size="13" textLength="404.873" font-family="Verdana">a row lock on the route and re-counts CURRENT rows; a loser</text><text x="162.5" y="221.406" fill="#000" font-size="13" textLength="280.636" font-family="Verdana">answers 409 and its transaction rolls back.</text><text x="162.5" y="237.205" fill="#000" font-size="13" textLength="411.874" font-family="Verdana">The driver sees CURRENT sends first, then SUPERSEDED ones.</text></g><g class="entity" data-qualified-name="GMN11" id="ent0012" data-source-line="16"><path d="M163,337.737 L163,395.135 L585.47,395.135 L585.47,347.737 L575.47,337.737 L163,337.737" style="stroke:#000;stroke-width:1;" fill="#FFF"/><path d="M575.47,337.737 L575.47,347.737 L585.47,347.737 L575.47,337.737" style="stroke:#000;stroke-width:1;" fill="#FFF"/><text x="169" y="355.807" fill="#000" font-size="13" textLength="401.47" font-family="Verdana">Sends are never updated otherwise and never deleted by the</text><text x="169" y="371.606" fill="#000" font-size="13" textLength="336.496" font-family="Verdana">application: they are the delivery history (BR-054).</text><text x="169" y="387.406" fill="#000" font-size="13" textLength="306.287" font-family="Verdana">A refused send (400/422/502) creates no row.</text></g><!--link *start* to CURRENT--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk3" data-source-line="4" data-link-type="dependency"><path d="M74,78.757 C74,99.667 74,147.027 74,178.067" style="stroke:#000;stroke-width:1;" fill="none" id="*start*-to-CURRENT"/><polygon points="74,183.067,78,174.067,74,178.067,70,174.067,74,183.067" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="107.802" y="122.807" fill="#000" font-size="13" textLength="157.568" font-family="Verdana">POST /routes/{id}/send</text><text x="75" y="138.606" fill="#000" font-size="13" textLength="223.171" font-family="Verdana">all checks and the LEZ guard pass</text></g><!--link CURRENT to SUPERSEDED--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk5" data-source-line="5" data-link-type="dependency"><path d="M73.38,233.267 C72.63,262.587 71.498,306.849 70.748,336.179" style="stroke:#000;stroke-width:1;" fill="none" id="CURRENT-to-SUPERSEDED"/><polygon points="70.62,341.177,74.849,332.282,70.748,336.179,66.851,332.078,70.62,341.177" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="74" y="288.807" fill="#000" font-size="13" textLength="209.028" font-family="Verdana">a newer send of the same route</text><text x="76.041" y="304.606" fill="#000" font-size="13" textLength="204.947" font-family="Verdana">(same transaction as its insert)</text></g><!--link SUPERSEDED to *end*--><g class="link" data-entity-1="ent0004" data-entity-2="ent0006" id="lnk7" data-source-line="6" data-link-type="dependency"><path d="M70,391.337 C70,411.837 70,435.287 70,450.377" style="stroke:#000;stroke-width:1;" fill="none" id="SUPERSEDED-to-*end*"/><polygon points="70,455.377,74,446.377,70,450.377,66,446.377,70,455.377" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link CURRENT to GMN8--><g class="link" data-entity-1="ent0002" data-entity-2="ent0009" id="lnk10" data-source-line="9" data-link-type="association"><path d="M117.51,208.237 C130.48,208.237 143.46,208.237 156.43,208.237" style="stroke:#000;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="CURRENT-GMN8"/></g><!--link GMN8 to GMN11--><g class="link" data-entity-1="ent0009" data-entity-2="ent0012" id="lnk13" data-source-line="16" data-link-type="association"><path d="M373.23,245.027 C373.41,273.097 373.66,311.587 373.82,337.387" style="stroke:#000;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="GMN8-GMN11"/></g><?plantuml-src LP3DJ-Cm4CNl_Yk6MxkY9AeA4goq4hlD3R6eAHS-3cuofLPTE_9CgAhL_k_CE7oKGvGudlURzzu9Rt27q7dhWc777c5UNa2AFICGXXQ8BVS4ereETVuU6_Fuunacar_mvtwng6wNS0LtV-ib55b7nJ_N_YzK_HIizz1iiDaIMA79EhYf7k2bjwc5pXAP3uRowlkxQb5NysekI0i1zvW66t6TjMJ5RTxo54RvmCa6iWsx6C0IE9Od42OUcoEQmiMqCI5AiEHUDgp8zzq6u9fX5qb-1lnCbHTtuY0llCe61ZQaFX3qeSKaMYi3U_2nsOeyJmtzQU24aoRsGLnzK6MMVeh6HnhKWIGbmQoyp0fDS1mgHUy9LhRPdidqKkXjSg-v5wHlNWdMBX6VgeLmtAM4eZEZQJJ-Umcho1ntWgopr2QKlfNRTwrbbCe5a_QEXY33NOiUzMvrq2NglkkyQwmwpGKTCaWxa56rUO2D8uxo7lrUJChpsLXZN4inwvw4b4iUpSgoc4sdnNav7KEJK0oGcDMoleo_0G00?></g></svg>