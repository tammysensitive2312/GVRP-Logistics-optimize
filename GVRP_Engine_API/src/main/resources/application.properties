# Secrets come from environment variables or the git-ignored application-local.properties (SEC-001).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.application.name=GVRP_Engine_API
server.port=8081

spring.threads.virtual.enabled=true

spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100
spring.task.execution.pool.keep-alive=60s

spring.task.scheduling.pool.size=2

graphhopper.osm.file=./.data/vietnam-251213.osm.pbf
graphhopper.graph.location=./.cache/routing-graph

graph.encoded_values=road_access

spring.jackson.property-naming-strategy=SNAKE_CASE

spring.optimization.entry.url=http://localhost:8080/api/v1
entry.api-key=${GVRP_ENGINE_CALLBACK_KEY:}

# Entry -> Engine service key (SEC-ENGINE-001). Every request except GET /api/v1/optimization/health
# must send it in X-Engine-Key; empty = every protected request is refused. Not the callback key above.
gvrp.security.inbound-key=${GVRP_ENGINE_INBOUND_KEY:}

# Server-side ceilings on one optimization request (SEC-ENGINE-001). Above a ceiling the request is
# refused (400 for iterations/threads, 413 for list sizes), never clamped.
gvrp.limits.max-iterations=20000
gvrp.limits.max-threads=16
gvrp.limits.max-orders=10000
gvrp.limits.max-vehicles=5000
gvrp.limits.max-depots=500
gvrp.limits.max-vehicle-types=500
# Wall-clock cap on solving per job, from job start. The request's timeout_seconds is advisory.
gvrp.solver.max-runtime-seconds=7200

gvrp.result-spool.dir=./.data/results
gvrp.result-spool.max-attempts=20
gvrp.result-spool.retry.initial-delay-ms=60000
gvrp.result-spool.retry.interval-ms=120000
# Retention sweep (SpoolRetentionSweeper, daily 03:00): payload trong sent/
# quá 7 ngày và poison/ quá 30 ngày thì xóa. pending/ không bao giờ bị đụng.
gvrp.result-spool.sent-retention-days=7
gvrp.result-spool.poison-retention-days=30
gvrp.result-spool.sweep-cron=0 0 3 * * *