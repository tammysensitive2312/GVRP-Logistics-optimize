<nav class="navbar">
  <div class="navbar-left">
    <button type="button" class="btn-icon" aria-label="Open settings menu" (click)="toggleSidebar()">
      ☰
    </button>
    <div class="brand">
      <span class="brand-icon">⚙️</span>
      <span class="brand-name">Administrator</span>
    </div>
  </div>

  <div class="navbar-right">
    <button type="button" class="btn btn-secondary" (click)="backToDashboard()">
      ← Back to Dashboard
    </button>
  </div>
</nav>

<div class="admin-settings-layout">
  <aside class="admin-sidebar" [class.show]="sidebarOpen()">
    <div class="admin-sidebar-header">
      <h2>
        <span>⚙️</span>
        Settings
      </h2>
    </div>

    <div class="admin-menu">
      @for (item of menuItems; track item.path) {
        <a
          class="admin-menu-item"
          [routerLink]="item.path"
          routerLinkActive="active"
          (click)="closeSidebar()">
          <span class="icon">{{ item.icon }}</span>
          <span class="label">{{ item.label }}</span>
        </a>
      }
    </div>

    <div class="admin-sidebar-footer">
      <button type="button" class="btn btn-secondary full-width" (click)="backToDashboard()">
        ← Back
      </button>
    </div>
  </aside>

  <main class="admin-content">
    <router-outlet></router-outlet>
  </main>
</div>
